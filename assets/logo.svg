<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#0369a1" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>

    <!-- Outer Shield Rim Gradient -->
    <linearGradient id="shieldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="35%" stop-color="#0284c7"/>
      <stop offset="70%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </linearGradient>

    <!-- Shield Face Gradient -->
    <linearGradient id="shieldFace" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#031525"/>
    </linearGradient>

    <!-- Metallic Facet Left -->
    <linearGradient id="facetLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Metallic Facet Right -->
    <linearGradient id="facetRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.01"/>
    </linearGradient>

    <!-- Core Lightning Bolt Gradient -->
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="30%" stop-color="#38bdf8"/>
      <stop offset="70%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <!-- Bolt Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur1"/>
      <feGaussianBlur stdDeviation="22" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Armor Plate Shadow -->
    <filter id="plateShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0284c7" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="256" cy="240" r="230" fill="url(#bgGlow)"/>

  <!-- Outer Protective Halo Ring (Subtle Cyber Orbit) -->
  <circle cx="256" cy="256" r="232" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="8 12" stroke-opacity="0.25"/>
  <circle cx="256" cy="256" r="244" fill="none" stroke="#0284c7" stroke-width="1" stroke-dasharray="40 180" stroke-opacity="0.4"/>

  <!-- Fortress Shield Main Body with Shadow -->
  <g filter="url(#plateShadow)">
    <!-- Outer Rim Armor -->
    <path d="M 256,58
             L 396,96
             C 416,102 426,122 424,142
             L 410,272
             C 398,348 340,412 256,454
             C 172,412 114,348 102,272
             L 88,142
             C 86,122 96,102 116,96
             Z"
          fill="url(#shieldRim)"
          stroke="#38bdf8"
          stroke-width="2"
          stroke-linejoin="round"/>

    <!-- Inner Shield Inset Plate -->
    <path d="M 256,76
             L 384,110
             C 398,114 406,128 404,142
             L 392,264
             C 382,330 330,388 256,428
             C 182,388 130,330 120,264
             L 108,142
             C 106,128 114,114 128,110
             Z"
          fill="url(#shieldFace)"
          stroke="#0284c7"
          stroke-width="2.5"
          stroke-linejoin="round"/>

    <!-- Facet Division Left -->
    <path d="M 256,76
             L 128,110
             C 114,114 106,128 108,142
             L 120,264
             C 130,330 182,388 256,428
             Z"
          fill="url(#facetLeft)"/>

    <!-- Facet Division Right -->
    <path d="M 256,76
             L 384,110
             C 398,114 406,128 404,142
             L 392,264
             C 382,330 330,388 256,428
             Z"
          fill="url(#facetRight)"/>

    <!-- Central Vertical Spine Line -->
    <line x1="256" y1="76" x2="256" y2="428" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.35"/>

    <!-- Precision Horizontal Tech Grid Lines -->
    <line x1="160" y1="180" x2="352" y2="180" stroke="#0284c7" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="4 8"/>
    <line x1="140" y1="240" x2="372" y2="240" stroke="#0284c7" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="4 8"/>
    <line x1="170" y1="310" x2="342" y2="310" stroke="#0284c7" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="4 8"/>

    <!-- Corner Circuit Node Accent Dots -->
    <circle cx="256" cy="76" r="3.5" fill="#38bdf8"/>
    <circle cx="384" cy="110" r="3" fill="#38bdf8"/>
    <circle cx="128" cy="110" r="3" fill="#38bdf8"/>
    <circle cx="392" cy="264" r="3" fill="#0284c7"/>
    <circle cx="120" cy="264" r="3" fill="#0284c7"/>
    <circle cx="256" cy="428" r="3.5" fill="#38bdf8"/>
  </g>

  <!-- Central High-Tech Vault Core: Hardened Lightning Bolt + Diamond Vault -->
  <g filter="url(#neonGlow)">
    <!-- Vault Keyhole / Inner Octagon Backplate -->
    <polygon points="256,150 296,174 296,220 256,244 216,220 216,174"
             fill="#0284c7"
             fill-opacity="0.2"
             stroke="#38bdf8"
             stroke-width="1.5"
             stroke-dasharray="6 4"/>

    <!-- Dynamic Chiseled Lightning Bolt Core -->
    <path d="M 272,130
             L 204,244
             L 248,244
             L 232,354
             L 316,226
             L 268,226
             L 294,130
             Z"
          fill="url(#boltGrad)"
          stroke="#ffffff"
          stroke-width="1.5"
          stroke-linejoin="miter"
          stroke-miterlimit="4"/>

    <!-- Inner Core Core White Hot Spark Center -->
    <polygon points="256,215 272,236 244,236" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- Upper Left Specular Reflection Glare (Sleek Apple Polished Titanium Aesthetic) -->
  <path d="M 256,78
           L 132,112
           C 120,116 114,128 116,140
           L 124,230
           C 146,180 200,120 256,78
           Z"
        fill="#ffffff"
        fill-opacity="0.08"/>
</svg>
